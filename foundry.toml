[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.37"
optimizer = true
optimizer_runs = 200
via_ir = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"

[profile.sepolia]
eth_rpc_url = "${SEPOLIA_RPC_URL}"
chain_id = 11155111
verify = true
